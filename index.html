<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guia Prático do Comerciante Campeão | Assaí</title>
  <meta name="description" content="Um Guia Prático de Compras para o seu Negócio. Escolha a categoria, selecione os produtos e baixe a sua lista personalizada." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,400;9..40,500;9..40,700;9..40,800&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="stage">

    <!-- ============ HERO ============ -->
    <header class="hero">
      <img class="hero__logo" src="assets/img/logo-assai.png" alt="Assaí Atacadista" width="190" height="190" />

      <img class="hero__banner" src="assets/img/banner-top.png" alt="Não perca mais vendas e abasteça seu negócio com a lista certa!" />

     

      <!-- Título estilizado -->
      <div class="hero__title" aria-label="Guia Prático do Comerciante Campeão">
        <img src="assets/img/h1.png" alt="Guia Prático do Comerciante Campeão" />
      </div>

      <p class="hero__subtitle">Um Guia Prático de Compras para o seu Negócio</p>

      <!-- Passos -->
      <ol class="steps">
        <li class="step step--1"><span class="step__num">1</span><span class="step__text">Escolha a categoria do seu negócio</span></li>
        <li class="step step--2"><span class="step__num">2</span><span class="step__text">Selecione os produtos</span></li>
        <li class="step step--3"><span class="step__num">3</span><span class="step__text">Baixe a sua lista personalizada</span></li>
        <li class="step step--4"><span class="step__num">4</span><span class="step__text">Corra pro Assaí mais perto de você</span></li>
      </ol>
    </header>

    <!-- ============ CATEGORIAS (render via JS) ============ -->
    <main class="categories" id="categories"></main>

    <!-- ============ FOOTER ============ -->
    <footer class="footer">
      <img class="footer__logo" src="assets/img/logo-assai.png" alt="Assaí Atacadista" width="190" height="190" />
    </footer>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
